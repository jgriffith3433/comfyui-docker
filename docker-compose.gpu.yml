# =============================================================================
# ComfyUI GPU — for EC2 deployment
# Build: docker compose -f docker-compose.gpu.yml build
# Push:  docker compose -f docker-compose.gpu.yml push
#
# Deploy on server:
#   docker compose -f docker-compose.gpu.yml pull
#   docker compose -f docker-compose.gpu.yml up -d
#
# Models, outputs, and inputs are stored in named Docker volumes.
# These persist across container recreates/upgrades as long as you
# don't run `docker volume prune` or terminate the instance.
#
# IMPORTANT: g4dn NVMe is ephemeral! If Docker data-root is on NVMe,
# stopping the instance loses everything. Use EBS-backed storage for
# model persistence. See deploy docs for EBS setup.
# =============================================================================
services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      platforms:
        - linux/amd64
    image: jgriffith3433/comfyui-docker:gpu
    container_name: comfyui
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
      - RESOLVE_MODELS=${RESOLVE_MODELS:-true}
    volumes:
      # Named volumes — persist across container recreates
      - comfyui-models:/root/ComfyUI/models
      - comfyui-output:/root/ComfyUI/output
      - comfyui-input:/root/ComfyUI/input
    ports:
      - "8188:8188"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  comfyui-models:
  comfyui-output:
  comfyui-input:
